name: Update Shadowrocket Rules

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y curl jq

      - name: Download domain list
        run: |
          curl -s https://raw.githubusercontent.com/hydraponique/roscomvpn-geosite/refs/heads/master/data/whitelist -o domains_raw.txt

      - name: Download CIDR list
        run: |
          curl -s https://raw.githubusercontent.com/hydraponique/roscomvpn-geoip/refs/heads/master/release/text/whitelist.txt -o cidr_raw.txt

      - name: Clean domain list
        run: |
          cat domains_raw.txt \
            | sed 's/^domain://g' \
            | sed 's/^domain-set://g' \
            | sed 's/^domain-suffix://g' \
            | sed 's/ //g' \
            | sed '/^$/d' \
            > domains_cleaned.txt

      - name: Generate domain rule-set
        run: |
          cat domains_cleaned.txt \
            | sed 's/^/DOMAIN-SUFFIX,&,DIRECT/' \
            > shadowrocket_domains.conf

      - name: Generate CIDR rule-set
        run: |
          cat cidr_raw.txt \
            | sed 's/^/IP-CIDR,&,DIRECT/' \
            > shadowrocket_cidr.conf

      - name: Commit & Push
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          git add *.conf || true

          git commit -m "Auto-update rules" || echo "No changes to commit"

          # безопасный пуш — не падает при конфликте
          git pull --rebase || true
          git push || true