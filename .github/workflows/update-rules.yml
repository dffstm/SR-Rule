name: Update Shadowrocket Rules

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set git config
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions@github.com"

      - name: Download source lists
        run: |
          mkdir -p src
          curl -s https://raw.githubusercontent.com/hydraponique/roscomvpn-geosite/refs/heads/master/data/whitelist -o src/domains.txt
          curl -s https://raw.githubusercontent.com/hydraponique/roscomvpn-geoip/refs/heads/master/release/text/whitelist.txt -o src/ips.txt

      - name: Generate Shadowrocket domain rules
        run: |
          mkdir -p output
          cat src/domains.txt \
            | sed -E 's/^domain://g' \
            | sed '/^$/d' \
            | sed 's/\r//g' \
            | while read dom; do
                echo "DOMAIN-SUFFIX,$dom,DIRECT"
              done > output/shadowrocket_domains.conf

      - name: Generate Shadowrocket CIDR rules
        run: |
          cat src/ips.txt \
            | grep -oE '[0-9]{1,3}(\.[0-9]{1,3}){3}(/[0-9]{1,2})?' \
            | sed '/^$/d' \
            | while read ip; do
                echo "IP-CIDR,$ip,DIRECT"
              done > output/shadowrocket_cidr.conf

      - name: Copy to repo root
        run: |
          cp output/shadowrocket_domains.conf .
          cp output/shadowrocket_cidr.conf .

      - name: Commit and Push
        run: |
          git add shadowrocket_domains.conf shadowrocket_cidr.conf || true
          git commit -m "Auto-update rules" || true
          git push origin main || true